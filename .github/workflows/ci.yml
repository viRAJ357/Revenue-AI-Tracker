name: CI — RecoverAI Hackathon

on:
  push:
    branches: [ main, master, fresh-main ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify_and_test:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install catboost pandas scikit-learn fastapi uvicorn pydantic

      # ── 4. Run full CI verification suite ──────────────────────────────────
      - name: Verify model, backend & inference
        run: python ci_local_test.py

      # ── 5. Upload model artefacts ──────────────────────────────────────────
      - name: Upload model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: recoverai-model-artefacts
          path: |
            model/recoverai_catboost.cbm
            model/feature_importance.csv
            model/metrics.json
