<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecoverAI - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Manrope:wght@520;700&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css" />

    darkMode: "class",
    theme: {

            "colors": {

                "on-secondary-fixed": "#001f23",

                "on-primary-fixed": "#000469",
                "primary-fixed-dim": "#bec2ff",
                "on-secondary-fixed-variant": "#004f57",
                "on-error-container": "#ffdad6",
                "on-tertiary": "#512300",
                "outline-variant": "#454655",
                "surface-variant": "#353436",
                "on-tertiary-fixed-variant": "#743500",
                "on-primary-fixed-variant": "#1f2bc8",
                "primary-container": "#7a85ff",
                "on-surface": "#e5e2e3",
                "tertiary-fixed-dim": "#ffb689",
                "background": "#131314",
                "on-tertiary-container": "#471e00",
                "surface-container": "#201f21",
                "inverse-on-surface": "#313031",
                "tertiary-fixed": "#ffdbc8",
                "on-background": "#e5e2e3",
                "tertiary": "#ffb689",
                "surface": "#131314",
                "error-container": "#93000a",
                "on-secondary-container": "#003e44",
                "surface-tint": "#bec2ff",
                "on-error": "#690005",
                "surface-container-highest": "#353436",
                "surface-dim": "#131314",
                "primary-fixed": "#e0e0ff",
                "error": "#ffb4ab",
                "surface-container-lowest": "#0e0e0f",
                "surface-container-high": "#2a2a2b",
                "inverse-primary": "#3d4ae0",
                "secondary-fixed": "#92f1ff",
                "on-primary-container": "#000992",
                "secondary-fixed-dim": "#50d8e9",
                "on-secondary": "#00363c",
                "surface-container-low": "#1c1b1d",
                "outline": "#8f8fa1",
                "secondary": "#50d8e9",
                "primary": "#bec2ff",
                "on-tertiary-fixed": "#311300",
                "secondary-container": "#00b1c2",
                "tertiary-container": "#e0731d",
                "inverse-surface": "#e5e2e3",
                "on-primary": "#000ba6"
            },
            "fontFamily": {
                "label-sm": ["Inter"],
                "mono-data": ["Inter"],
                "body-md": ["Inter"],
                "body-lg": ["Inter"],

                "h1": ["Manrope"],

<style>
  body { background-color: #131314; color: #e5e2e3; font-family: 'Inter', sans-serif; }
  .glass-panel { background: rgba(20, 21, 23, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid #1B1C1E; }
  .grid-bg { background-image: linear-gradient(to right, #1B1C1E 1px, transparent 1px), linear-gradient(to bottom, #1B1C1E 1px, transparent 1px); background-size: 40px 40px; }
  input {
      background-color: #1c1b1d !important;
      border: 1px solid #454655 !important;
      color: #e5e2e3 !important;
      border-radius: 4px;
  }
  input:focus {
      outline: none;
      border-color: #bec2ff !important;
      box-shadow: 0 0 0 1px #bec2ff !important;
  }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center grid-bg">

<div class="w-full max-w-md p-8 bg-[#101112] border border-[#232426] rounded-xl shadow-2xl glass-panel relative">
    <div class="text-center mb-8">
        <div class="flex justify-center mb-4">
            <span class="material-symbols-outlined text-secondary text-5xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
        </div>
        <h1 class="font-h3 text-h3 text-on-surface mb-2">RecoverAI</h1>
        <p class="text-on-surface-variant font-body-md">Sign in to access the Command Dashboard</p>
    </div>

    <form id="loginForm" class="space-y-6">
        <div id="errorMsg" class="hidden text-error bg-error-container/20 border border-error/50 p-3 rounded font-label-sm text-center">
            Invalid credentials.
        </div>
        <div>
            <label class="block font-label-sm text-on-surface-variant uppercase tracking-wider mb-2" for="username">Username</label>
            <input class="w-full p-3 font-body-md" type="text" id="username" placeholder="admin" required />
        </div>
        <div>
            <label class="block font-label-sm text-on-surface-variant uppercase tracking-wider mb-2" for="password">Password</label>
            <input class="w-full p-3 font-body-md" type="password" id="password" placeholder="admin" required />
        </div>
        <button class="w-full bg-[#5E6BFF] hover:bg-[#4d5add] text-white py-3 rounded font-body-md font-bold transition-colors flex justify-center items-center gap-2" type="submit" id="loginBtn">
            <span class="material-symbols-outlined text-[18px]">login</span> Sign In
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <p class="text-[10px] text-outline-variant font-mono-data">Demo Credentials: admin / admin</p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> Authenticating...';
    errorMsg.classList.add('hidden');

    try {
        const response = await fetch('http://localhost:8001/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('recoverai_token', data.access_token);
            window.location.href = 'index.html';
        } else {
            errorMsg.classList.remove('hidden');
        }
    } catch (error) {
        errorMsg.textContent = "Unable to connect to server.";
        errorMsg.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">login</span> Sign In';
    }
});
</script>
</body>
</html>
