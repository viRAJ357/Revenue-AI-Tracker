<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revenue AI Tracker — 3D Flow Graph</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0d1117; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #info {
      position:absolute; top:20px; left:20px; z-index:10;
      background:rgba(22,27,34,0.85); padding:14px 22px;
      border-radius:10px; border:1px solid #30363d;
      box-shadow:0 4px 20px rgba(0,0,0,0.6);
    }
    h1 { margin:0 0 6px; font-size:1.3rem;
      background:linear-gradient(90deg,#f78166,#ff9f5a);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    p  { margin:0; font-size:.8rem; color:#8b949e; }
    #badge {
      position:absolute; bottom:20px; right:20px; z-index:10;
      background:rgba(22,27,34,0.85); padding:8px 16px;
      border-radius:8px; border:1px solid #30363d; color:#58a6ff; font-size:.75rem;
    }
  </style>
  <script src="https://unpkg.com/3d-force-graph@1.73.5/dist/3d-force-graph.min.js"></script>
</head>
<body>
  <div id="info">
    <h1>Revenue AI Tracker</h1>
    <p>3D Flow Graph &nbsp;|&nbsp; Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Hover for details</p>
  </div>
  <div id="badge">github.com/viRAJ357/Revenue-AI-Tracker</div>
  <div id="graph"></div>

<script>
const PHASES = {
  setup:   { color:'#58a6ff', label:'Setup' },
  data:    { color:'#3fb9b4', label:'Data' },
  ml:      { color:'#e5c059', label:'AI/ML' },
  api:     { color:'#f86666', label:'API' },
  viz:     { color:'#bc8cff', label:'Visualization' },
  deploy:  { color:'#f86666', label:'DevOps' },
};

const nodes = [
  { id:'root',  name:'Revenue AI Tracker',         phase:'setup',  val:35 },
  { id:'s01',   name:'01 · Project Setup',          phase:'setup',  val:18 },
  { id:'s02',   name:'02 · Data Ingestion',          phase:'data',   val:16 },
  { id:'s03',   name:'03 · Preprocessing',           phase:'data',   val:16 },
  { id:'s04',   name:'04 · EDA',                     phase:'data',   val:16 },
  { id:'s05',   name:'05 · Feature Engineering',     phase:'ml',     val:18 },
  { id:'s06',   name:'06 · AI Model Training',       phase:'ml',     val:22 },
  { id:'s07',   name:'07 · Model Evaluation',        phase:'ml',     val:18 },
  { id:'s08',   name:'08 · Revenue Prediction API',  phase:'api',    val:22 },
  { id:'s09',   name:'09 · Dashboard & Viz',         phase:'viz',    val:18 },
  { id:'s10',   name:'10 · Deployment & Monitoring', phase:'deploy', val:22 },
];

const links = [
  {source:'root',target:'s01'},
  {source:'s01', target:'s02'},
  {source:'s02', target:'s03'},
  {source:'s03', target:'s04'},
  {source:'s04', target:'s05'},
  {source:'s05', target:'s06'},
  {source:'s06', target:'s07'},
  {source:'s07', target:'s08'},
  {source:'s08', target:'s09'},
  {source:'s09', target:'s10'},
  // cross links to show interconnection
  {source:'s04', target:'s06'},
  {source:'s07', target:'s09'},
];

const Graph = ForceGraph3D()(document.getElementById('graph'))
  .graphData({ nodes, links })
  .backgroundColor('#0d1117')
  .nodeLabel('name')
  .nodeVal('val')
  .nodeColor(n => PHASES[n.phase].color)
  .nodeOpacity(0.92)
  .linkColor(() => 'rgba(88,166,255,0.35)')
  .linkWidth(1.5)
  .linkDirectionalParticles(3)
  .linkDirectionalParticleWidth(2.5)
  .linkDirectionalParticleSpeed(0.006)
  .linkDirectionalParticleColor(l => PHASES[nodes.find(n=>n.id===l.target)?.phase||'setup'].color)
  .onNodeHover(node => {
    document.body.style.cursor = node ? 'pointer' : null;
  });

// slow auto-rotate
let angle = 0;
setInterval(() => {
  Graph.cameraPosition({
    x: 350 * Math.sin(angle),
    z: 350 * Math.cos(angle)
  });
  angle += Math.PI / 900;
}, 16);
</script>
</body>
</html>
